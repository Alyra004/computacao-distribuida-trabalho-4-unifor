services:

  nginx:
    image: nginx:1.19.0
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./data/wordpress:/usr/share/nginx/html
      - ./logs:/var/log/nginx/balanceamento
    networks:
      default:
        aliases:
          - frontend.test
    depends_on:
      wordpress:
        condition: service_healthy

  wordpress:
    image: wordpress:5.4.2-php7.2-apache
    restart: always
    deploy:
      replicas: 3
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_USER: example
      WORDPRESS_DB_PASSWORD: example
      WORDPRESS_DB_NAME: example
      RES_OPTIONS: single-request-reopen
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@fsockopen('127.0.0.1', 80) ? 0 : 1);"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - ./data/wordpress:/var/www/html
    depends_on:
      - db

  locust:
    image: locustio/locust:2.32.0
    ports:
      - "8089:8089"
    volumes:
      - ./locust:/mnt/locust
      - ./results:/mnt/results
    environment:
      LOCUST_LOCUSTFILE: /mnt/locust/locustfile.py
      LOCUST_HOST: http://frontend.test
      SCENARIO: "1"
    depends_on:
      - nginx

  db:
    image: mysql:5.7
    platform: linux/amd64
    restart: always
    environment:
      MYSQL_DATABASE: example
      MYSQL_USER: example
      MYSQL_PASSWORD: example
      MYSQL_RANDOM_ROOT_PASSWORD: '1'
    volumes:
      - ./data/db:/var/lib/mysql

networks:
  default:
    ipam:
      config:
        - subnet: 172.30.0.0/24
          ip_range: 172.30.0.128/25

